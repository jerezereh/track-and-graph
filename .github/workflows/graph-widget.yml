name: Graph widget APK
on:
  push:
    branches: [feature/graph-widget]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: graph-widget-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Test and build FOSS debug APK
        working-directory: app
        run: ./gradlew :app:testFossDebugUnitTest :app:assembleFossDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: graph-and-track-debug
          path: app/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: app/app/build/reports/tests/testFossDebugUnitTest/
